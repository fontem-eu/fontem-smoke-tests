sonar.projectKey=gmr-smoke-tests
sonar.projectName=GMR Smoke Tests
sonar.sources=tests,docs
sonar.tests=tests
# Everything under tests/ is test code — specs AND shared harness/helpers
# (baseTest.js, fixtures, page objects). This repo is e2e-only: it runs
# Playwright against a deployed environment and produces NO coverage
# report, so any .js here treated as production source would fail the
# new_coverage gate forever. Modelling all of tests/**/*.js as test code
# (not just *.spec.js) keeps static analysis — code smells are still
# reported on test code — without the impossible coverage demand.
sonar.test.inclusions=tests/**/*.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=node_modules/**,test-results/**,playwright-report/**,.scannerwork/**
sonar.qualitygate.wait=true
