# Scheduled DAST — every 3 days, in-cluster, unattended.
#
# The previous arrangement had a ZAP CronJob suspended on a schedule of
# "0 0 31 2 *" (February 31st — a date that never arrives) acting as a
# template for a workstation script. That script was last run by a human
# on 2026-06-15. Nothing ran it in between and nothing noticed.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dast-scanner
  namespace: fontem-dast

---
# The scanner publishes its verdict into a ConfigMap and reads the
# previous one back for the diff. That is all it may do — it cannot
# touch workloads, secrets, or anything outside this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dast-scanner
  namespace: fontem-dast
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dast-scanner
  namespace: fontem-dast
subjects:
  - kind: ServiceAccount
    name: dast-scanner
    namespace: fontem-dast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dast-scanner

---
# ZAP as a long-lived Deployment rather than a per-run Job: no RBAC to
# create Jobs, no waiting for a pod to schedule, and the scan script
# resets state with core/action/newSession, which is what a fresh Job
# would have given us anyway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zap
  namespace: fontem-dast
  labels: { app: zap }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: zap }
  template:
    metadata:
      labels: { app: zap }
      annotations:
        # ZAP is a proxy; the mesh sidecar rewrites the traffic it exists
        # to observe.
        linkerd.io/inject: disabled
    spec:
      containers:
        - name: zap
          image: ghcr.io/zaproxy/zaproxy:stable
          args:
            - "zap.sh"
            - "-daemon"
            - "-host"
            - "0.0.0.0"
            - "-port"
            - "8080"
            - "-config"
            - "api.addrs.addr.name=.*"
            - "-config"
            - "api.addrs.addr.regex=true"
            - "-config"
            - "api.disablekey=true"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /JSON/core/view/version/, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }

---
apiVersion: v1
kind: Service
metadata:
  name: zap
  namespace: fontem-dast
spec:
  selector: { app: zap }
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dast-scan
  namespace: fontem-dast
spec:
  # Every 3 days at 01:30 UTC. Not */3 on the day-of-month field alone —
  # that resets awkwardly at month boundaries (31st then 1st) — but it is
  # the standard cron idiom and close enough for a scan cadence.
  schedule: "30 1 */3 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # One attempt. A retry would double a ~40 minute scan and the
      # second run's diff baseline would be the first run's own output.
      backoffLimit: 0
      activeDeadlineSeconds: 5400
      template:
        metadata:
          annotations:
            linkerd.io/inject: disabled
        spec:
          restartPolicy: Never
          serviceAccountName: dast-scanner
          imagePullSecrets:
            - name: regcred
          containers:
            - name: scan
              image: contribute.void42.internal/fontem/fontem-smoke-tests:latest
              command: ["/bin/bash", "/app/dast/scheduled-scan.sh"]
              env:
                - name: TEST_EMAIL
                  valueFrom: { secretKeyRef: { name: gmr-smoke-creds, key: email } }
                - name: TEST_PASSWORD
                  valueFrom: { secretKeyRef: { name: gmr-smoke-creds, key: password } }
                - name: WORK_DIR
                  value: /work
              resources:
                requests: { cpu: 250m, memory: 1Gi }
                limits: { cpu: "2", memory: 3Gi }
              volumeMounts:
                - { name: work, mountPath: /work }
          volumes:
            - name: work
              emptyDir: {}
