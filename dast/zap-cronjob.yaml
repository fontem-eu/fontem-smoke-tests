# OWASP ZAP DAST scanner — suspended CronJob, triggered manually via:
#   kubectl create job zap-scan-$(date +%s) --from=cronjob/zap-dast -n gmr-dast
#
# Or use the orchestration script: /config/repos/infra/scripts/run-dast-scan.sh
#
# ZAP runs in daemon mode with the API enabled. The orchestration script
# drives the scan externally: spider → passive (with e2e traffic) → active → report.

# BookStack API credentials — materialised by VSO from
# Vault at `secret/gmr-dast/bookstack`. The token_id / token_secret
# pair was moved out of this manifest on 2026-04-22; the stringData
# block lived here in plaintext before that (gitleaks found it,
# we rotated via: read existing value → vault kv put → delete inline).
#
# Rotate: `vault kv put secret/gmr-dast/bookstack token_id=... token_secret=...`
# VSO syncs within refreshAfter (24h) or on annotation refresh-now=true.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: bookstack-api
  namespace: fontem-dast
spec:
  type: kv-v2
  mount: secret
  path: fontem-dast/bookstack
  destination:
    create: true
    name: bookstack-api
  refreshAfter: 24h
  vaultAuthRef: fontem-dast-vault-auth

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zap-dast
  namespace: fontem-dast
spec:
  schedule: "0 0 31 2 *"   # Feb 31 = never; trigger manually
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # 2 h ceiling — schemathesis runs at 1 req/s (since fontem-smoke-tests
      # PR #74 to stay under the /capi/ rate limiter) and chews through
      # ~5,000 generated cases over ~95 min on the current API surface.
      # The 1-hour ceiling tripped on 2026-05-10 mid-run, killed the ZAP
      # daemon before the active-scan phase landed, and lost the BookStack
      # report. 2 h leaves headroom for a few more endpoints worth of
      # surface growth without hitting the wall.
      activeDeadlineSeconds: 7200
      backoffLimit: 0
      template:
        metadata:
          annotations:
            # ZAP active-scan fires thousands of outbound requests per
            # second. The linkerd-proxy sidecar's default memory limit
            # (~64 MiB) gets OOM-killed under that load, after which all
            # outbound goes to dev/null and the scan stalls forever.
            # The DAST namespace doesn't need service mesh — every call
            # is either to the in-cluster ZAP API (short lived, control
            # plane) or out through the ingress (already terminated by
            # nginx). Skip injection.
            linkerd.io/inject: disabled
        spec:
          restartPolicy: Never
          containers:
            - name: zap
              image: ghcr.io/zaproxy/zaproxy:stable
              command: ["zap.sh"]
              args:
                - "-daemon"
                - "-host"
                - "0.0.0.0"
                - "-port"
                - "8080"
                - "-config"
                - "api.addrs.addr.name=.*"
                - "-config"
                - "api.addrs.addr.regex=true"
                - "-config"
                - "api.disablekey=true"
              ports:
                - name: http
                  containerPort: 8080
              env:
                # JVM auto-sizes heap to 25% of container memory by
                # default — that's only 4 GiB of the 16 GiB pod limit,
                # not enough for active-scan + retire.js + Suspicious
                # Comments running concurrently on our ~2 MiB prerendered
                # bundle. Set heap explicitly to 12 GiB so ZAP has room
                # and leaves ~4 GiB for the JVM's own overhead.
                - name: JAVA_TOOL_OPTIONS
                  value: "-Xmx12g -XX:MaxRAMPercentage=75"
              resources:
                requests: { cpu: 500m, memory: 4Gi }
                limits: { cpu: 4, memory: 16Gi }
              readinessProbe:
                httpGet:
                  path: /JSON/core/view/version/
                  port: 8080
                initialDelaySeconds: 30
                periodSeconds: 5

---
# Service so the orchestration script and Playwright can reach ZAP
apiVersion: v1
kind: Service
metadata:
  name: zap
  namespace: fontem-dast
spec:
  selector:
    job-name: placeholder   # Updated by the orchestration script
  ports:
    - name: proxy
      port: 8080
      targetPort: 8080
