# OWASP ZAP DAST scanner — suspended CronJob, triggered manually via:
#   kubectl create job zap-scan-$(date +%s) --from=cronjob/zap-dast -n gmr-dast
#
# Or use the orchestration script: /config/repos/infra/scripts/run-dast-scan.sh
#
# ZAP runs in daemon mode with the API enabled. The orchestration script
# drives the scan externally: spider → passive (with e2e traffic) → active → report.

apiVersion: v1
kind: Secret
metadata:
  name: bookstack-api
  namespace: gmr-dast
type: Opaque
stringData:
  token_id: "zapc8ae4702e028c90b30ba6e80d89675fc"
  token_secret: "5ed936c26b75ff7b2353794904263c29f2d29ee95e1adc9cba21f67b3427d105"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zap-dast
  namespace: gmr-dast
spec:
  schedule: "0 0 31 2 *"   # Feb 31 = never; trigger manually
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600   # 1 hour hard limit
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: zap
              image: ghcr.io/zaproxy/zaproxy:stable
              command: ["zap.sh"]
              args:
                - "-daemon"
                - "-host"
                - "0.0.0.0"
                - "-port"
                - "8080"
                - "-config"
                - "api.addrs.addr.name=.*"
                - "-config"
                - "api.addrs.addr.regex=true"
                - "-config"
                - "api.disablekey=true"
              ports:
                - name: http
                  containerPort: 8080
              resources:
                requests: { cpu: 250m, memory: 1Gi }
                limits: { cpu: 2, memory: 4Gi }
              readinessProbe:
                httpGet:
                  path: /JSON/core/view/version/
                  port: 8080
                initialDelaySeconds: 30
                periodSeconds: 5

---
# Service so the orchestration script and Playwright can reach ZAP
apiVersion: v1
kind: Service
metadata:
  name: zap
  namespace: gmr-dast
spec:
  selector:
    job-name: placeholder   # Updated by the orchestration script
  ports:
    - name: proxy
      port: 8080
      targetPort: 8080
