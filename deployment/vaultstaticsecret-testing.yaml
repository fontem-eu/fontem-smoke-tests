---
# Smoke/e2e credentials for the testing environment, sourced from Vault.
#
# Before this, `gmr-smoke-creds` in fontem-testing was a hand-created
# Secret with no owner and no VaultStaticSecret — the only secret in that
# namespace not backed by Vault, so the accounts the gate depends on
# existed nowhere but in the cluster.
#
# Holds the researcher account the suite authenticates as, plus the three
# throwaway personas permissions-matrix.spec.js drives (contrib / viewer /
# outsider) and their shared password. The persona emails are stable by
# design: re-registering returns 409 instead of burning the /auth/register
# rate limit on every run.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gmr-smoke-creds
  namespace: fontem-testing
spec:
  vaultAuthRef: fontem-testing-vault-auth
  mount: secret
  type: kv-v2
  path: fontem-testing/smoke-creds
  refreshAfter: 1h
  destination:
    create: true
    name: gmr-smoke-creds
    # The Secret already exists (hand-created). Let VSO adopt and manage
    # it rather than erroring out or leaving the stale copy in place.
    overwrite: true
