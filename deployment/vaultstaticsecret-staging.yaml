---
# Smoke-test credentials for the staging CronJob.
# Synced from Vault KV at secret/gmr-staging/smoke-creds.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gmr-smoke-creds
  # namespace: set by Argo Application destination
spec:
  vaultAuthRef: gmr-staging-vault-auth
  mount: secret
  type: kv-v2
  path: gmr-staging/smoke-creds
  refreshAfter: 24h
  destination:
    name: gmr-smoke-creds
    create: true
