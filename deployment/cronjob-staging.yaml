---
# Smoke tests against STAGING (gmr-staging.void42.internal).
#
# The schedule is SUSPENDED — staging only runs smoke tests as a pre-promotion
# gate, not on a periodic cadence (periodic smoke monitoring lives in prod).
# The CronJob exists purely as a template for the gitops promote workflow,
# which invokes it via `kubectl create job --from=cronjob/gmr-smoke-tests-staging`
# before every prod promotion. Failures here block prod promotion.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gmr-smoke-tests-staging
  namespace: gmr-staging
  labels:
    app: gmr-smoke-tests
    environment: staging
spec:
  schedule: "0 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: gmr-smoke-tests
            environment: staging
          annotations:
            linkerd.io/inject: disabled
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: regcred
          containers:
            - name: smoke
              image: contribute.void42.internal/golden/gmr-smoke-tests:v2a618b5
              env:
                - name: BASE_URL
                  value: "https://gmr-staging.void42.internal"
                - name: TEST_EMAIL
                  valueFrom: { secretKeyRef: { name: gmr-smoke-creds, key: email } }
                - name: TEST_PASSWORD
                  valueFrom: { secretKeyRef: { name: gmr-smoke-creds, key: password } }
                - name: KUMA_PUSH_URL
                  valueFrom: { secretKeyRef: { name: gmr-smoke-creds, key: kuma_push_url, optional: true } }
              resources:
                requests: { memory: "512Mi", cpu: "250m" }
                limits: { memory: "1Gi", cpu: "1000m" }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  out=$(npx playwright test --project=chromium 2>&1); rc=$?; echo "$out"
                  summary=$(echo "$out" | grep -oE '[0-9]+ passed|[0-9]+ failed|[0-9]+ flaky' | tr '\n' ' ' | sed 's/ $//' | tr ' ' '+')
                  [ -n "$KUMA_PUSH_URL" ] && { [ "$rc" -eq 0 ] && curl -fsS -m 10 "$KUMA_PUSH_URL?status=up&msg=${summary:-unknown}&ping=" || curl -fsS -m 10 "$KUMA_PUSH_URL?status=down&msg=${summary:-unknown}&ping="; } || true
                  exit $rc
