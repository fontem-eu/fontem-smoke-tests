---
# Smoke tests against PROD (gmr.void42.net) — all 22 tests including ASSIST
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gmr-smoke-tests-prod
  namespace: gmr
  labels:
    app: gmr-smoke-tests
    environment: prod
spec:
  schedule: "0 */8 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: gmr-smoke-tests
            environment: prod
          annotations:
            linkerd.io/inject: disabled
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: regcred
          containers:
            - name: smoke
              image: contribute.void42.internal/golden/gmr-smoke-tests:vcf3585b
              env:
                - name: BASE_URL
                  value: "https://gmr.void42.net"
                - name: TEST_EMAIL
                  valueFrom: { secretKeyRef: { name: gmr-smoke-creds, key: email } }
                - name: TEST_PASSWORD
                  valueFrom: { secretKeyRef: { name: gmr-smoke-creds, key: password } }
                - name: KUMA_PUSH_URL
                  valueFrom: { secretKeyRef: { name: gmr-smoke-creds, key: kuma_push_url_prod, optional: true } }
              resources:
                requests: { memory: "512Mi", cpu: "250m" }
                limits: { memory: "1Gi", cpu: "1000m" }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  out=$(npx playwright test --project=chromium 2>&1); rc=$?; echo "$out"
                  summary=$(echo "$out" | grep -oE '[0-9]+ passed|[0-9]+ failed|[0-9]+ flaky' | tr '\n' ' ' | sed 's/ $//' | tr ' ' '+')
                  [ -n "$KUMA_PUSH_URL" ] && { [ "$rc" -eq 0 ] && curl -fsS -m 10 "$KUMA_PUSH_URL?status=up&msg=${summary:-unknown}&ping=" || curl -fsS -m 10 "$KUMA_PUSH_URL?status=down&msg=${summary:-unknown}&ping="; } || true
                  exit $rc
