---
# Smoke tests against PROD (gmr.void42.net) — all 22 tests including ASSIST
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fontem-smoke-tests-prod
  # namespace: set by Argo Application destination
  labels:
    app: fontem-smoke-tests
    environment: prod
spec:
  schedule: "0 */8 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: fontem-smoke-tests
            environment: prod
          annotations:
            linkerd.io/inject: disabled
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: regcred
          containers:
            - name: smoke
              image: contribute.void42.internal/fontem/fontem-smoke-tests:vb9a2061
              env:
                - name: BASE_URL
                  value: "https://gmr.void42.net"
                - name: TEST_EMAIL
                  valueFrom: { secretKeyRef: { name: gmr-smoke-creds, key: email } }
                - name: TEST_PASSWORD
                  valueFrom: { secretKeyRef: { name: gmr-smoke-creds, key: password } }
                - name: KUMA_PUSH_URL
                  valueFrom: { secretKeyRef: { name: gmr-smoke-creds, key: kuma_push_url_prod, optional: true } }
              resources:
                requests: { memory: "512Mi", cpu: "250m" }
                limits: { memory: "1Gi", cpu: "1000m" }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  # Default to "down" — if the pod dies for any reason
                  # (SIGKILL at activeDeadlineSeconds, OOM, node eviction)
                  # the trap pushes a down signal before exit. Overwritten
                  # to "up" only after a clean rc=0.
                  KUMA_STATUS=down
                  KUMA_SUMMARY=unknown
                  push_kuma() {
                    [ -z "$KUMA_PUSH_URL" ] && return 0
                    curl -fsS -m 10 "$KUMA_PUSH_URL?status=$KUMA_STATUS&msg=$KUMA_SUMMARY&ping=" || true
                  }
                  trap push_kuma EXIT
                  out=$(npx playwright test --project=chromium 2>&1); rc=$?; echo "$out"
                  KUMA_SUMMARY=$(echo "$out" | grep -oE '[0-9]+ passed|[0-9]+ failed|[0-9]+ flaky' | tr '\n' ' ' | sed 's/ $//' | tr ' ' '+')
                  KUMA_SUMMARY=${KUMA_SUMMARY:-unknown}
                  [ "$rc" -eq 0 ] && KUMA_STATUS=up
                  exit $rc
