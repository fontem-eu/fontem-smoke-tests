apiVersion: v1
kind: Secret
metadata:
  name: gmr-smoke-creds
  # namespace: set by Argo Application destination
type: Opaque
stringData:
  # Was `researcher@gmr.test`; `.test` is a reserved TLD per RFC 2606
  # and fontem-community-api's pydantic EmailStr (added in PR #59,
  # commit d9b724e) rejects reserved TLDs at registration time. The
  # smoke-test user could never be created in fontem-testing, so
  # global-setup.js login returned 401 every cycle. `@fontem.eu`
  # is our real contact domain and validates cleanly.
  email: "researcher@fontem.eu"
  password: "TestPass123!"
  kuma_push_url_prod: "http://uptime-kuma.uptime-kuma.svc.cluster.local:3001/api/push/gmr-smoke-prod"
  kuma_push_url_dev: "http://uptime-kuma.uptime-kuma.svc.cluster.local:3001/api/push/gmr-smoke-dev"
