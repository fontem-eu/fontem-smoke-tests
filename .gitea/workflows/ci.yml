name: Build and sign smoke tests image
on:
  push:
    branches: [main]
    # The deploy job below sed-bumps the cronjob manifests in this same
    # repo and pushes the change back to main. Without this path filter
    # we'd loop: each bump commit would trigger a fresh build.
    paths-ignore:
      - 'deployment/**'
  pull_request:

jobs:
  # Pre-build supply-chain gate; see gmr-ci/actions/osv-scan.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.fontem-ci/actions/osv-scan
      - name: Secret scan (gitleaks)
        uses: ./.fontem-ci/actions/secret-scan

  # SonarQube static analysis. Runs on both PR and main. There's no unit-test
  # suite here — Playwright e2e runs against a deployed environment, not in
  # CI — so no coverage report is produced; Sonar gets static analysis only.
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SonarQube can blame-diff new vs existing
          # code; a shallow clone makes it treat everything as new.
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.CI_READ_TOKEN }}
      - uses: ./.fontem-ci/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  build-sign:
    needs: security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.CI_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          # Pin Node 22 explicitly so cyclonedx-npm and the docker
          # build use a known version. The runner's bundled node
          # has bitten us before — fontem-web #120 / vite 8.
          node-version: '22'

      - name: Install deps (for cyclonedx-npm)
        run: npm ci --prefer-offline --no-audit --no-fund

      - id: sbom
        name: Generate + upload SBOM
        uses: ./.fontem-ci/actions/sbom-generate
        with:
          language: node
          project-name: fontem-smoke-tests
          project-version: ${{ github.sha }}
          dtrack-key: ${{ secrets.DTRACK_API_KEY }}

      - id: image
        name: Build, push, sign, attest
        uses: ./.fontem-ci/actions/docker-build-sign
        with:
          image: contribute.void42.internal/fontem/fontem-smoke-tests
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          sbom-path: ${{ steps.sbom.outputs.sbom-path }}

  # The whole deploy is now just: sed the cronjob manifests, commit,
  # push. ArgoCD apps in the gitops repo (fontem-smoke-tests-staging /
  # fontem-smoke-tests-prod) watch `deployment/cronjob-staging.yaml` and
  # `deployment/cronjob.yaml` here and pick up the bump automatically.
  #
  # No kubectl needed — no PROMOTE_KUBECONFIG dependency.
  # No gmr-ci `gitops-bump` action — no cross-repo coordination.
  # No version-marker file in golden/gitops — ArgoCD's reconcile is
  # the only signal.
  deploy:
    needs: build-sign
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: tag
        name: Compute image tag
        run: echo "value=v$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Bump cronjob image tags + commit + push
        env:
          REG_USER: ${{ secrets.REGISTRY_USER }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          # Match fontem-smoke-tests:<anything-but-space> — guards against
          # the tag format widening eating surrounding YAML.
          sed -i "s|fontem-smoke-tests:[A-Za-z0-9.-]*|fontem-smoke-tests:$TAG|" \
              deployment/cronjob-staging.yaml \
              deployment/cronjob.yaml
          git config user.name "GMR CI"
          git config user.email "ci@void42.internal"
          # actions/checkout writes an http.<base>.extraheader that
          # authenticates as the per-task `gitea-actions` user, which
          # is *not* in main's push-whitelist. Drop it so our explicit
          # URL credentials (REGISTRY_USER=lucid) are what the server
          # sees on push.
          git config --local --unset-all \
            "http.http://gitea-http.dev-tools.svc.cluster.local:3000/.extraheader" \
            || true
          git remote set-url origin "http://${REG_USER}:${REG_PASS}@gitea-http.dev-tools.svc.cluster.local:3000/fontem/fontem-smoke-tests.git"
          if ! git diff --quiet; then
            # [skip ci] is belt-and-braces; paths-ignore on the trigger
            # is the primary loop guard.
            git commit -am "ci: bump cronjobs to $TAG [skip ci]"
            git push origin main
          fi
