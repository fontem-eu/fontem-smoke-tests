name: Build and sign smoke tests image
on:
  push:
    branches: [main]
    # The deploy job below sed-bumps the cronjob manifests in this same
    # repo and pushes the change back to main. Without this path filter
    # we'd loop: each bump commit would trigger a fresh build.
    paths-ignore:
      - 'deployment/**'
  pull_request:

jobs:
  # Pre-build supply-chain gate; see gmr-ci/actions/osv-scan.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.ci-actions/actions/osv-scan
      - name: Secret scan (gitleaks)
        uses: ./.ci-actions/actions/secret-scan

  # SonarQube static analysis. Runs on both PR and main. There's no unit-test
  # suite here — Playwright e2e runs against a deployed environment, not in
  # CI — so no coverage report is produced; Sonar gets static analysis only.
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so SonarQube can blame-diff new vs existing
          # code; a shallow clone makes it treat everything as new.
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      - uses: ./.ci-actions/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  build-sign:
    needs: security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          # Pin Node 22 explicitly so cyclonedx-npm and the docker
          # build use a known version. The runner's bundled node
          # has bitten us before — fontem-web #120 / vite 8.
          node-version: '22'

      - name: Install deps (for cyclonedx-npm)
        run: npm ci --prefer-offline --no-audit --no-fund

      - id: sbom
        name: Generate + upload SBOM
        uses: ./.ci-actions/actions/sbom-generate
        with:
          language: node
          project-name: fontem-smoke-tests
          project-version: ${{ github.sha }}

      - id: image
        name: Build, push, sign, attest
        uses: ./.ci-actions/actions/docker-build-sign
        with:
          image: contribute.void42.internal/fontem/fontem-smoke-tests
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          sbom-path: ${{ steps.sbom.outputs.sbom-path }}

  # Deploy = publish which image the promotion gate should run.
  #
  # This used to sed deployment/cronjob-staging.yaml and cronjob.yaml,
  # which no longer exist: e2e stopped being a scheduled CronJob and
  # became a one-shot Job the gitops promote workflows render. The step
  # was therefore editing files that were gone, so nothing got committed
  # and gitops/testing/fontem-smoke-tests.yaml stayed frozen at
  # v50518a5 — a tag the registry had already collected. The gate reads
  # that marker, so every promotion failed its image preflight with
  # "the testing pin is stale".
  #
  # The marker is the contract between this repo and the gate, so CI has
  # to maintain it. Bumping it is also what triggers promote.yml, whose
  # trigger is paths: ['testing/**'].
  deploy:
    needs: build-sign
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: tag
        name: Compute image tag
        run: echo "value=v$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Bump the gitops testing pin
        env:
          REG_USER: ${{ secrets.REGISTRY_USER }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gitops
          git clone --depth=1 \
            "http://${REG_USER}:${REG_PASS}@gitea-http.dev-tools.svc.cluster.local:3000/fontem/gitops.git" \
            /tmp/gitops
          cd /tmp/gitops
          F=testing/fontem-smoke-tests.yaml
          # Anchor on the key: `version:` sits under a comment block in
          # this file, so a line-number edit silently does nothing.
          CUR=$(grep '^version:' "$F" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$CUR" = "$TAG" ]; then
            echo "already at $TAG"
            exit 0
          fi
          sed -i "s/^version: \".*\"/version: \"$TAG\"/" "$F"
          echo "bumped $CUR -> $TAG"

          # The scheduled DAST CronJob runs this same image, from
          # infra/dast.yaml. It is not a `version:` pin — it is a real
          # image reference inside a manifest — so it needs its own
          # substitution, anchored on the image name.
          D=infra/dast.yaml
          sed -i "s|\(fontem/fontem-smoke-tests:\)v[0-9a-f]\{7,\}|\1$TAG|" "$D"
          if git diff --quiet -- "$D"; then
            echo "dast scan image already at $TAG"
          else
            echo "bumped the dast scan image -> $TAG"
          fi
          git config user.name "GMR CI"
          git config user.email "ci@void42.internal"
          git commit -am "ci: deploy fontem-smoke-tests $TAG to testing"
          # Bounded fetch-rebase-push: other repos' CI pushes here too.
          ATTEMPT=0
          until git push origin main; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ $ATTEMPT -ge 5 ]; then
              echo "::error::push rejected after 5 attempts"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "::error::rebase conflict in testing/"; exit 1; }
            sleep $((ATTEMPT * 2))
          done
