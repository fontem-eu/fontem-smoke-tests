name: Build and sign smoke tests image
on:
  push:
    branches: [main]
    # The deploy job below sed-bumps the cronjob manifests in this same
    # repo and pushes the change back to main. Without this path filter
    # we'd loop: each bump commit would trigger a fresh build.
    paths-ignore:
      - 'deployment/**'
  pull_request:

jobs:
  # Pre-build supply-chain gate; see gmr-ci/actions/osv-scan.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.ci-actions/actions/osv-scan
      - name: Secret scan (gitleaks)
        uses: ./.ci-actions/actions/secret-scan

  # SonarQube static analysis. Runs on both PR and main. There's no unit-test
  # suite here — Playwright e2e runs against a deployed environment, not in
  # CI — so no coverage report is produced; Sonar gets static analysis only.
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so SonarQube can blame-diff new vs existing
          # code; a shallow clone makes it treat everything as new.
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      - uses: ./.ci-actions/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  build-sign:
    needs: security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          # Pin Node 22 explicitly so cyclonedx-npm and the docker
          # build use a known version. The runner's bundled node
          # has bitten us before — fontem-web #120 / vite 8.
          node-version: '22'

      - name: Install deps (for cyclonedx-npm)
        run: npm ci --prefer-offline --no-audit --no-fund

      - id: sbom
        name: Generate + upload SBOM
        uses: ./.ci-actions/actions/sbom-generate
        with:
          language: node
          project-name: fontem-smoke-tests
          project-version: ${{ github.sha }}

      - id: image
        name: Build, push, sign, attest
        uses: ./.ci-actions/actions/docker-build-sign
        with:
          image: contribute.void42.internal/fontem/fontem-smoke-tests
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          sbom-path: ${{ steps.sbom.outputs.sbom-path }}

  # Deploy = publish which image the promotion gate should run.
  #
  # This used to sed deployment/cronjob-staging.yaml and cronjob.yaml,
  # which no longer exist: e2e stopped being a scheduled CronJob and
  # became a one-shot Job the gitops promote workflows render. The step
  # was therefore editing files that were gone, so nothing got committed
  # and gitops/testing/fontem-smoke-tests.yaml stayed frozen at
  # v50518a5 — a tag the registry had already collected. The gate reads
  # that marker, so every promotion failed its image preflight with
  # "the testing pin is stale".
  #
  # The marker is the contract between this repo and the gate, so CI has
  # to maintain it. Bumping it is also what triggers promote.yml, whose
  # trigger is paths: ['testing/**'].
  deploy:
    needs: build-sign
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: tag
        name: Compute image tag
        run: echo "value=v$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Bump the gitops testing pin
        env:
          REG_USER: ${{ secrets.REGISTRY_USER }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gitops
          git clone --depth=1 \
            "http://${REG_USER}:${REG_PASS}@gitea-http.dev-tools.svc.cluster.local:3000/fontem/gitops.git" \
            /tmp/gitops
          cd /tmp/gitops
          F=testing/fontem-smoke-tests.yaml
          # Anchor on the key: `version:` sits under a comment block in
          # this file, so a line-number edit silently does nothing.
          CUR=$(grep '^version:' "$F" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$CUR" = "$TAG" ]; then
            echo "already at $TAG"
            exit 0
          fi
          sed -i "s/^version: \".*\"/version: \"$TAG\"/" "$F"
          echo "bumped $CUR -> $TAG"

          # The scheduled DAST CronJob runs this same image, from
          # infra/dast.yaml. It is not a `version:` pin — it is a real
          # image reference inside a manifest — so it needs its own
          # substitution, anchored on the image name.
          D=infra/dast.yaml
          sed -i "s|\(fontem/fontem-smoke-tests:\)v[0-9a-f]\{7,\}|\1$TAG|" "$D"
          if git diff --quiet -- "$D"; then
            echo "dast scan image already at $TAG"
          else
            echo "bumped the dast scan image -> $TAG"
          fi
          git config user.name "GMR CI"
          git config user.email "ci@void42.internal"
          git commit -am "ci: deploy fontem-smoke-tests $TAG to testing"
          # Bounded fetch-rebase-push: other repos' CI pushes here too.
          ATTEMPT=0
          until git push origin main; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ $ATTEMPT -ge 5 ]; then
              echo "::error::push rejected after 5 attempts"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "::error::rebase conflict in testing/"; exit 1; }
            sleep $((ATTEMPT * 2))
          done

  # Renovate bumps the very libraries this suite is built on — Playwright,
  # eslint — but nothing else in this workflow ever executes a test. As the
  # comment on `analyze` says, the e2e runs against a deployed environment,
  # not in CI. So a dependency bump could reach main having never been run
  # once: @playwright/test v1.60 automerged on 2026-08-26 completely
  # unexercised, because this repo's branch protection required no checks.
  #
  # This builds the PR and runs the real suite against staging, so the bump
  # is gated on the tests it actually changes. Register it as a required
  # status check — Renovate's platformAutomerge defers to Gitea's
  # merge-when-checks-pass, which only waits for *required* contexts.
  #
  # The renovate-only scoping is a STEP guard, not a job-level `if:`. A job
  # skipped by `if:` publishes no status, so as a required context it would
  # block every human PR forever waiting on a check that never reports.
  # This way the job always runs and always reports; it just exits early
  # with nothing to do when the PR isn't a dependency bump.
  e2e-staging:
    needs: security
    runs-on: ubuntu-latest
    # attest-staging (in gitops) seeds fixtures into this same namespace to
    # mint the tested-in-staging attestation. Two e2e Jobs at once would
    # race on that data and both could fail spuriously, so share its lock
    # rather than introduce a second one. Never cancel in progress: a
    # half-run suite leaves its fixtures behind.
    concurrency:
      group: attest-staging
      cancel-in-progress: false
    steps:
      - id: scope
        name: Gate applies?
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -eu
          case "$EVENT:$HEAD_REF" in
            pull_request:renovate/*)
              echo "dependency PR ($HEAD_REF) — running the staging e2e"
              echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "not a Renovate PR ($EVENT:$HEAD_REF) — nothing to gate"
              echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v5
      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}

      # The suite has to run as the PR built it, not as staging is pinned —
      # otherwise the gate exercises the old dependency set and proves
      # nothing about the bump.
      - id: image
        if: steps.scope.outputs.run == 'true'
        name: Build the PR image
        uses: ./.ci-actions/actions/docker-build-sign
        with:
          image: contribute.void42.internal/fontem/fontem-smoke-tests
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}

      - if: steps.scope.outputs.run == 'true'
        name: Install kubectl
        run: |
          curl -fsSLo /usr/local/bin/kubectl https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
          chmod +x /usr/local/bin/kubectl

      - if: steps.scope.outputs.run == 'true'
        name: Set up kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.PROMOTE_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "::error::PROMOTE_KUBECONFIG secret is empty — cannot reach the cluster"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - if: steps.scope.outputs.run == 'true'
        name: Run e2e against staging
        env:
          E2E_NAMESPACE: fontem-staging
          E2E_ENV: staging
          E2E_BASE_URL: https://fontem.staging.void42.internal
          E2E_IMAGE_TAG: ${{ steps.image.outputs.tag }}
          REG_USER: ${{ secrets.REGISTRY_USER }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          # The fixture init-container runs the community-api image, so it
          # has to match what staging is actually running — a mismatched
          # tag seeds against a schema the environment doesn't have.
          rm -rf /tmp/gitops
          git clone --depth=1 \
            "http://${REG_USER}:${REG_PASS}@gitea-http.dev-tools.svc.cluster.local:3000/fontem/gitops.git" \
            /tmp/gitops
          E2E_CAPI_TAG=$(grep '^version:' /tmp/gitops/staging/fontem-community-api.yaml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$E2E_CAPI_TAG" ]; then
            echo "::error::could not read the community-api tag from staging/fontem-community-api.yaml"
            exit 1
          fi
          echo "e2e image: $E2E_IMAGE_TAG   fixture image: $E2E_CAPI_TAG"

          JOB=$(sed -e "s|\${E2E_NAMESPACE}|$E2E_NAMESPACE|g" \
                    -e "s|\${E2E_ENV}|$E2E_ENV|g" \
                    -e "s|\${E2E_BASE_URL}|$E2E_BASE_URL|g" \
                    -e "s|\${E2E_IMAGE_TAG}|$E2E_IMAGE_TAG|g" \
                    -e "s|\${E2E_CAPI_TAG}|$E2E_CAPI_TAG|g" \
                    deployment/e2e-job.yaml \
                | kubectl create -f - -o name)
          echo "created $JOB in $E2E_NAMESPACE"

          # Shorter than the promotion gate's 65 minutes: this one blocks a
          # dependency PR, and a suite that hasn't finished in 40 is stuck,
          # not slow.
          DEADLINE=$((SECONDS + 2400))
          VERDICT=timeout
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            if [ "$(kubectl get "$JOB" -n "$E2E_NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}')" = "True" ]; then
              VERDICT=pass; break
            fi
            if [ "$(kubectl get "$JOB" -n "$E2E_NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}')" = "True" ]; then
              VERDICT=fail; break
            fi
            sleep 10
          done

          echo "::group::e2e output"
          kubectl logs "$JOB" -n "$E2E_NAMESPACE" --tail=400 || true
          echo "::endgroup::"

          kubectl delete "$JOB" -n "$E2E_NAMESPACE" --ignore-not-found

          if [ "$VERDICT" != "pass" ]; then
            echo "::error::e2e against staging did not pass ($VERDICT) — the dependency bump is not safe to merge"
            exit 1
          fi
          echo "e2e green — bump is safe to merge"
