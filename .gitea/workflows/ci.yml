name: Build and sign smoke tests image
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Pre-build supply-chain gate; see gmr-ci/actions/osv-scan.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: golden/gmr-ci
          path: .gmr-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.gmr-ci/actions/osv-scan
      - name: Secret scan (gitleaks)
        uses: ./.gmr-ci/actions/secret-scan

  # Build → sign → attest SBOM. SBOM generation happens inline here
  # (replaces the separate `analyze` job) so the same file is both
  # uploaded to DT and used as the attestation predicate.
  build-sign:
    needs: security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: golden/gmr-ci
          path: .gmr-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}

      - name: Setup Docker CLI + Cosign
        run: |
          curl -fsSL https://nexus.void42.internal/repository/docker-releases/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz --strip-components=1 -C /usr/local/bin docker/docker
          curl -sL https://nexus.void42.internal/repository/github-releases/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign

      - name: Install deps (for cyclonedx-npm)
        run: npm ci --prefer-offline --no-audit --no-fund

      - id: sbom
        name: Generate + upload SBOM
        uses: ./.gmr-ci/actions/sbom-generate
        with:
          language: node
          project-name: gmr-smoke-tests
          project-version: ${{ github.sha }}
          dtrack-key: ${{ secrets.DTRACK_API_KEY }}

      - id: image
        name: Build, push, sign, attest
        uses: ./.gmr-ci/actions/docker-build-sign
        with:
          # Push via the cluster-internal Gitea URL over plaintext HTTP —
          # the same backend that contribute.void42.internal fronts.
          # Signatures are path-keyed in the repo, so Kyverno finds them
          # when deployments reference the image by its HTTPS hostname.
          # PR #39 briefly flipped this to contribute.void42.internal but
          # the DinD daemon's containerd pull path doesn't trust the
          # void42 private CA (Docker 29+ bypasses /etc/docker/certs.d).
          image: gitea-http.dev-tools.svc.cluster.local:3000/golden/gmr-smoke-tests
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          sbom-path: ${{ steps.sbom.outputs.sbom-path }}
