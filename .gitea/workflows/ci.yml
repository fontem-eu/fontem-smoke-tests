name: Build and sign smoke tests image
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Pre-build supply-chain gate; see gmr-ci/actions/osv-scan.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: golden/gmr-ci
          path: .gmr-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.gmr-ci/actions/osv-scan

  # First SBOM for this repo — previously no Dependency-Track project.
  analyze:
    needs: security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: golden/gmr-ci
          path: .gmr-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}
      - name: Generate + upload SBOM
        uses: ./.gmr-ci/actions/sbom-generate
        with:
          language: node
          project-name: gmr-smoke-tests
          project-version: ${{ github.sha }}
          dtrack-key: ${{ secrets.DTRACK_API_KEY }}

  build-sign:
    needs: security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker CLI + Cosign
        run: |
          curl -fsSL https://nexus.void42.internal/repository/docker-releases/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz --strip-components=1 -C /usr/local/bin docker/docker
          curl -sL https://nexus.void42.internal/repository/github-releases/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
      - name: Login to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login gitea-http.dev-tools.svc.cluster.local:3000 -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: Build, push, sign gmr-smoke-tests
        env:
          COSIGN_PASSWORD: ""
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          TAG="v$(git rev-parse --short HEAD)"
          IMAGE="gitea-http.dev-tools.svc.cluster.local:3000/golden/gmr-smoke-tests"
          docker build --network host -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG
          echo "$COSIGN_KEY" > /tmp/cosign.key
          cosign sign --key /tmp/cosign.key --yes --allow-http-registry $IMAGE:$TAG
          rm /tmp/cosign.key
          echo "Built, pushed, and signed $IMAGE:$TAG"
